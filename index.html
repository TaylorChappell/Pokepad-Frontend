<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ee" />
    <meta
      name="description"
      content="Kanto: discover community coins, collect eggs and packs, train Pokémon, and support your gym."
    />
    <link rel="icon" type="image/png" href="./assets/brand/kanto-emblem.png" />
    <title>Kanto · Pokémon Launchpad</title>
    <link rel="preload" as="image" href="./assets/brand/kanto-emblem.png" />
    <link rel="preload" as="image" href="./assets/brand/kanto-lockup.png" />
    <style>
      body {
        margin: 0;
      }
      body.is-booting {
        overflow: hidden;
      }
      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #f8f9fb;
        color: #25354b;
        font-family: Arial, sans-serif;
      }
      .boot-content {
        padding: 24px;
        text-align: center;
      }
      .boot-stage {
        position: relative;
        display: grid;
        place-items: center;
        width: 220px;
        height: 220px;
        margin: 0 auto;
      }
      .boot-emblem {
        position: relative;
        z-index: 2;
        width: 152px;
        height: 152px;
        object-fit: contain;
      }
      .boot-emblem,
      .boot-wordmark {
        opacity: 0;
        transition: opacity 160ms ease;
      }
      .boot-emblem[data-boot-ready='true'],
      .boot-wordmark[data-boot-ready='true'] {
        opacity: 1;
      }
      .boot-brand {
        margin: 16px 0 12px;
        font-size: 28px;
        letter-spacing: 2px;
      }
      .boot-brand svg {
        display: block;
        width: 225px;
        height: auto;
        max-width: 75vw;
        margin: 0 auto;
      }
      .boot-status {
        margin: 0;
        color: #66748a;
        font-size: 14px;
      }
      .boot-reload {
        display: none;
        margin: 20px auto 0;
        padding: 12px 22px;
        border: 0;
        border-radius: 12px;
        background: #e45b52;
        color: white;
        font:
          700 14px Arial,
          sans-serif;
        cursor: pointer;
      }
      .boot-screen.is-stalled .boot-reload {
        display: inline-flex;
      }
    </style>
  </head>
  <body class="is-booting">
    <div
      id="boot-screen"
      class="boot-screen"
      role="status"
      aria-live="polite"
      aria-label="Loading Kanto"
    >
      <div class="boot-content">
        <div class="boot-stage" aria-hidden="true">
          <img
            class="boot-emblem"
            src="./assets/brand/kanto-emblem.png"
            alt=""
            width="152"
            height="152"
            fetchpriority="high"
            draggable="false"
          />
          <div class="boot-shadow"></div>
        </div>
        <h1 class="boot-brand">
          <svg class="boot-wordmark" viewBox="725 175 1310 380" role="img" aria-label="Kanto">
            <image href="./assets/brand/kanto-lockup.png" width="2172" height="724" />
          </svg>
        </h1>
        <p id="boot-status" class="boot-status">Loading your trainer…</p>
        <button class="boot-reload" type="button" onclick="window.location.reload()">
          Reload Kanto
        </button>
        <noscript><p>Enable JavaScript to open Kanto.</p></noscript>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script>
      (() => {
        const screen = document.getElementById('boot-screen');
        // The loading screen itself must never expose an undecoded/broken image box.
        const revealArtwork = (element, image) => {
          const reveal = async () => {
            try {
              if (!image.naturalWidth) return;
              if (image.decode) await image.decode();
              if (element.isConnected) element.dataset.bootReady = 'true';
            } catch {
              /* Keep the loading message visible if artwork is unavailable. */
            }
          };
          image.addEventListener('load', reveal, { once: true });
          if (image.complete) void reveal();
        };
        const emblem = screen.querySelector('.boot-emblem');
        revealArtwork(emblem, emblem);
        const wordmark = screen.querySelector('.boot-wordmark');
        const wordmarkImage = new Image();
        revealArtwork(wordmark, wordmarkImage);
        wordmarkImage.src = wordmark.querySelector('image').getAttribute('href');
        screen.dataset.startedAt = String(performance.now());
        const showRetry = (failed) => {
          if (!screen.isConnected || screen.dataset.dismissing) return;
          screen.classList.add('is-stalled');
          document.getElementById('boot-status').textContent = failed
            ? 'Kanto could not load. Please reload to try again.'
            : 'Still loading. Check your connection or try reloading.';
          screen.setAttribute('aria-label', 'Kanto loading help');
        };
        screen.dataset.retryTimer = String(setTimeout(() => showRetry(false), 12000));
        window.__pokepadBootError = () => showRetry(true);
        window.addEventListener(
          'error',
          (event) => {
            if (event.target === window || event.target instanceof HTMLScriptElement)
              showRetry(true);
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__pokepadBootError?.()"></script>
  </body>
</html>
