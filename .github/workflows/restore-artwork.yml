name: Restore verified Pokémon artwork
on:
  push:
    branches: [staging]
    paths: [scripts/sync-shiny-assets.py, scripts/shiny-assets.json, scripts/full-sprite-assets.json, .github/workflows/restore-artwork.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore and verify original artwork
        run: python3 scripts/sync-shiny-assets.py
      - name: Commit complete frontend assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/shiny public/assets/sprites-full
          if ! git diff --cached --quiet; then
            git commit -m "Add verified shiny and complete Pokémon sprites"
            git push origin HEAD:staging
          fi
