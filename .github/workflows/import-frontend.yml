name: Import verified frontend source
on:
  push:
    branches: [staging]
    paths: ['.pokepad-import/**']
permissions:
  contents: write
concurrency:
  group: frontend-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore checksum-verified frontend assets
        run: |
          python3 -m venv /tmp/pokepad-import-venv
          /tmp/pokepad-import-venv/bin/pip install --disable-pip-version-check Pillow==12.3.0
          /tmp/pokepad-import-venv/bin/python .pokepad-import/restore.py
          rm -rf .pokepad-import
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit complete frontend files to staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified frontend artwork and complete source files'
          git push origin HEAD:staging
